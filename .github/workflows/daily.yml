name: Portfolio Acoes Americano

on:
  workflow_dispatch:

  schedule:
    # Segunda a sexta.
    # 22:30 UTC = 19:30 no horário de Brasília.
    # Executa após o fechamento do mercado americano.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  portfolio:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

      # Identificação utilizada nas requisições à SEC
      SEC_USER_AGENT: "Vilson Portfolio Research vilsonjosepereirapinto@gmail.com"

      # Configuração do envio por e-mail
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:

      # ================================================================
      # 1. REPOSITÓRIO
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================================
      # 2. PYTHON
      # ================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ================================================================
      # 3. DEPENDÊNCIAS
      # ================================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Garante a biblioteca usada para gerar o PDF
          python -m pip install reportlab


      # ================================================================
      # 4. DIRETÓRIOS
      # ================================================================

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p data/cache
          mkdir -p output


      # ================================================================
      # 5. VALIDAR CONFIGURAÇÃO
      # ================================================================

      - name: Validate configuration
        run: |
          python -m py_compile config.py
          python -m py_compile data.py
          python -m py_compile selection.py
          python -m py_compile entry.py
          python -m py_compile report.py
          python -m py_compile email_report.py
          python -m py_compile main.py

          if [ -z "$SEC_USER_AGENT" ]; then
            echo "ERRO: SEC_USER_AGENT está vazio."
            exit 1
          fi

          echo "Configuração validada."


      # ================================================================
      # 6. EXECUTAR MOTOR
      # ================================================================

      - name: Run portfolio engine
        run: |
          python -u main.py


      # ================================================================
      # 7. VALIDAR RESULTADOS
      # ================================================================

      - name: Validate generated reports
        run: |
          test -s output/portfolio_ranking.csv
          test -s output/portfolio_report.pdf

          echo "Relatórios principais encontrados."

          ls -lh output/portfolio_ranking.csv
          ls -lh output/portfolio_report.pdf


      # ================================================================
      # 8. MOSTRAR ARQUIVOS GERADOS
      # ================================================================

      - name: Show generated files
        if: always()
        run: |
          echo "===== OUTPUT ====="
          find output -maxdepth 2 -type f -print || true

          echo "===== DATA ====="
          find data -maxdepth 2 -type f -print || true


      # ================================================================
      # 9. ENVIAR RELATÓRIO POR E-MAIL
      # ================================================================

      - name: Validate email configuration
        run: |
          missing=0

          for var in SMTP_SERVER SMTP_PORT SMTP_USER SMTP_PASSWORD EMAIL_TO
          do
            if [ -z "${!var}" ]; then
              echo "ERRO: $var está vazio."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Configuração de e-mail validada."


      - name: Send portfolio report by email
        run: |
          python -u email_report.py


      # ================================================================
      # 10. SALVAR RELATÓRIOS COMO ARTIFACT
      # ================================================================

      - name: Upload reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-report
          path: |
            output/*.pdf
            output/*.csv
          if-no-files-found: error
          retention-days: 30


      # ================================================================
      # 11. PERSISTIR CARTEIRA ATUAL
      # ================================================================
      #
      # O current_portfolio.csv precisa permanecer no repositório,
      # pois será usado pela próxima execução para verificar rotação.
      #
      # ================================================================

      - name: Commit current portfolio
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current_portfolio.csv || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na carteira para salvar."
          else
            git commit -m "Update current portfolio"
            git push
          fi
