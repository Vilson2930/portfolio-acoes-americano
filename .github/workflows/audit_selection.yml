name: Audit Selection - Study vs GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-selection:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance lxml beautifulsoup4 pyarrow
          fi

      - name: Validate Python files
        run: |
          python -m py_compile config.py
          python -m py_compile data.py
          python -m py_compile selection.py
          python -m py_compile audit_selection.py

      - name: Run Selection Audit
        run: |
          python audit_selection.py

      - name: Upload Selection Audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-audit
          path: |
            output/audit_selection_comparison.csv
            output/audit_selection_reference.csv
            output/audit_selection_github.csv
          if-no-files-found: warn
          retention-days: 30
