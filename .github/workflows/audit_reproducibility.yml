name: Final Reproducibility Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-reproducibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance lxml beautifulsoup4 pyarrow reportlab
          fi

      - name: Validate final audit syntax
        run: |
          python -m py_compile audit_reproducibility.py

      - name: Run final reproducibility audit
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python audit_reproducibility.py

      - name: Upload final audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reproducibility-audit
          path: |
            output/audit_reproducibility.json
            output/audit_reproducibility.txt
            output/*.csv
            output/*.pdf
          if-no-files-found: warn
          retention-days: 30
