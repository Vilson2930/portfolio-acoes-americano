name: Final Reproducibility Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-reproducibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: "Vilson Portfolio Research vilsonjosepereirapinto@gmail.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance lxml beautifulsoup4 pyarrow reportlab
          fi

      - name: Validate SEC User Agent
        run: |
          echo "SEC User-Agent configurado:"
          echo "$SEC_USER_AGENT"

          if [ -z "$SEC_USER_AGENT" ]; then
            echo "ERRO: SEC_USER_AGENT está vazio."
            exit 1
          fi

      - name: Validate final audit syntax
        run: |
          python -m py_compile audit_reproducibility.py

      - name: Run final reproducibility audit
        run: |
          python -u audit_reproducibility.py

      - name: Upload final audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reproducibility-audit
          path: |
            output/audit_reproducibility.json
            output/audit_reproducibility.txt
            output/*.csv
            output/*.pdf
          if-no-files-found: warn
          retention-days: 30
