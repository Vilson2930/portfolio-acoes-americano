name: Regression Test Cell 41

on:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p cache
          mkdir -p output

      - name: Run Cell 41 regression test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python regression_test.py

      - name: Upload regression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-cell41-audit
          path: output/regression_cell41_comparison.csv
          if-no-files-found: warn
          retention-days: 30
