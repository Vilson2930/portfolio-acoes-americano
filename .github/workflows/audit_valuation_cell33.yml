name: Audit Valuation - Cell 33

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-valuation-cell33:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance lxml beautifulsoup4 pyarrow
          fi

      - name: Validate Python files
        run: |
          python -m py_compile config.py
          python -m py_compile data.py
          python -m py_compile entry.py
          python -m py_compile audit_valuation_cell33.py

      - name: Run Cell 33 Valuation Audit
        run: |
          python audit_valuation_cell33.py

      - name: Upload Cell 33 Audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-valuation-cell33
          path: |
            output/audit_valuation_cell33_history.csv
            output/audit_valuation_cell33_coverage.csv
            output/audit_valuation_cell33_first_valid.csv
            output/audit_valuation_cell33_current.csv
          if-no-files-found: warn
          retention-days: 30
