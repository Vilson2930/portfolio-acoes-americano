name: Audit Industrials Cell 41 

on:
  workflow_dispatch:

jobs:
  audit-industrials:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p cache
          mkdir -p output

      - name: Run Industrials audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python audit_industrials.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-industrials-cell41
          path: |
            output/audit_industrials_current.csv
            output/audit_industrials_history.csv
          if-no-files-found: warn
          retention-days: 30
